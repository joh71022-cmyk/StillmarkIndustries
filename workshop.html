<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workshop - Stillmark Industries</title>
<meta name="description" content="The Stillmark Industries workshop: click the gear, build your factory.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23fff' stroke-width='4' stroke-dasharray='4 3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=31">
</head>
<body class="gamepage workshop ready">
  <canvas id="fx" aria-hidden="true"></canvas>

  <div class="bg-gears" aria-hidden="true">
    <div class="g" style="--x:-12vmin;--y:calc(100% - 34vmin);--s:48vmin;--d:16"><svg class="gear dim" data-teeth="16" data-outer="100" data-root="86" data-ring="66" data-hub="10" data-spokes="4" style="--t:100s"></svg></div>
    <div class="g" style="--x:calc(100% - 30vmin);--y:10vmin;--s:40vmin;--d:-18"><svg class="gear dim rev" data-teeth="12" data-outer="100" data-root="85" data-ring="64" data-hub="12" data-spokes="4" style="--t:80s"></svg></div>
  </div>

  <nav class="top"><a href="index.html" data-go class="back">&lt; MENU</a></nav>

  <main class="hero wk">
    <p class="kicker rise" style="--r:0">// THE WORKSHOP</p>
    <h1 class="gtitle rise" style="--r:1">CLICK THE GEAR</h1>

    <div class="counter rise" style="--r:2">
      <b id="cogs">0</b><small>COGS</small><span id="rate">0 / SEC</span>
    </div>

    <button class="bigcog rise" style="--r:3" id="cog" type="button" aria-label="Click the gear to earn cogs">
      <svg class="gear main" data-teeth="14" data-outer="100" data-root="84" data-ring="64" data-hub="16" data-spokes="7" style="--t:14s"></svg>
    </button>

    <section class="shop rise" style="--r:4" id="shop" aria-label="Upgrades"></section>

    <section class="ach rise" style="--r:5" aria-label="Achievements">
      <h3>ACHIEVEMENTS <span id="achcount">0/0</span></h3>
      <ul id="ach"></ul>
    </section>

    <button class="ghost rise" style="--r:5" id="reset" type="button">RESET PROGRESS</button>
  </main>

  <div class="hud">
    <button type="button" data-t="sfx">SFX: ON</button>
    <button type="button" data-t="music">MUSIC: ON</button>
  </div>
  <footer class="foot"><span>&copy; STILLMARK INDUSTRIES</span><span id="clock">SYS --:--:--</span></footer>
  <div class="vignette" aria-hidden="true"></div>
  <div class="scan" aria-hidden="true"></div>
  <div class="wipe on" aria-hidden="true"></div>
  <script src="https://hollowblade-publish.joh71022.workers.dev/site-data.js"></script>
  <script>window.SITE_DATA || document.write('<script src="site-data.js?t=' + Math.floor(Date.now() / 60000) + '"><\/script>');</script>
  <script>window.HB_VER = '31';</script>
  <script src="blocks.js?v=31"></script>
  <script src="render.js?v=31"></script>
  <script src="script.js?v=31"></script>
  <script src="terminal.js?v=31"></script>
  <script src="admin.js?v=31"></script>
  <script src="workshop.js?v=31"></script>
</body>
</html>
