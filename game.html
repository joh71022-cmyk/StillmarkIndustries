<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game - Hollowblade Industries</title>
<meta name="description" content="Game info from Hollowblade Industries.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23fff' stroke-width='4' stroke-dasharray='4 3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="gamepage ready">
  <canvas id="fx" aria-hidden="true"></canvas>

  <div class="bg-gears" aria-hidden="true">
    <div class="g" style="--x:-12vmin;--y:calc(100% - 34vmin);--s:48vmin;--d:16"><svg class="gear dim" data-teeth="16" data-outer="100" data-root="86" data-ring="66" data-hub="10" data-spokes="4" style="--t:100s"></svg></div>
    <div class="g" style="--x:calc(100% - 30vmin);--y:10vmin;--s:40vmin;--d:-18"><svg class="gear dim rev" data-teeth="12" data-outer="100" data-root="85" data-ring="64" data-hub="12" data-spokes="4" style="--t:80s"></svg></div>
  </div>

  <nav class="top"><a href="games.html" data-go class="back">&lt; GAMES</a></nav>

  <main class="hero" id="game"></main>

  <div class="hud">
    <button type="button" data-t="sfx">SFX: ON</button>
    <button type="button" data-t="music">MUSIC: ON</button>
  </div>
  <footer class="foot"><span>&copy; HOLLOWBLADE INDUSTRIES</span><span id="clock">SYS --:--:--</span></footer>
  <div class="vignette" aria-hidden="true"></div>
  <div class="scan" aria-hidden="true"></div>
  <div class="wipe on" aria-hidden="true"></div>
  <script src="site-data.js"></script>
  <script src="render.js"></script>
  <script src="script.js"></script>
  <script src="terminal.js"></script>
  <script src="admin.js"></script>
</body>
</html>
